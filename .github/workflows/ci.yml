name: CI

# Push only, as in the other Mesub repos: every branch a pull request is opened
# from is pushed first.
on:
  push:
    branches: ["**"]
    # A version tag releases the site (docs.mesub.io), once approved in the
    # production environment, which takes tags v* only.
    tags: ["v*"]

# One run per branch: a new push cancels the one it supersedes. Except on main
# and on a tag: a tag's run carries a deploy that must not stop halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    # GitHub-hosted, as in the other public repos (SDKs, MCP, skills): their
    # minutes are free, and the VPS's runner does not take a public repo's jobs.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # pnpm before setup-node, or the pnpm cache is not found. No version
      # here: package.json declares packageManager.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # Writes the reference pages from the spec, then builds and prerenders;
      # fails on a broken internal link.
      - name: Build
        run: pnpm build

  # A version tag only, once the site builds: docs.mesub.io (#73). Main builds
  # and goes no further. A GitHub-hosted runner, which starts empty every time.
  deploy:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The environment holds FLY_API_TOKEN, scoped to mesub-docs, and releases
    # it to a v* tag only, after a reviewer approves and 15 minutes.
    environment:
      name: production
      url: https://docs.mesub.io
    concurrency:
      group: deploy-mesub-docs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
        with:
          version: 0.4.104
      # --no-public-ips: reached only through the tunnel. The check in fly.toml
      # fails this step when the release cannot answer.
      - name: Deploy to mesub-docs
        run: flyctl deploy --remote-only --no-public-ips
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # The release state, never the app's logs: this repository's runs are
      # public.
      - name: Show the release state
        if: failure()
        run: flyctl status && flyctl releases | head -n 5
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
