# The documentation, docs.mesub.io: one site for both environments (#73). No
# public IP: the Cloudflare Tunnel's hostname docs.mesub.io points at
# http://mesub-docs.internal:3000, over Fly's private network. No secret: the
# site calls nothing on its own, the try-it panel calls the API from the
# reader's browser.
app = "mesub-docs"
primary_region = "cdg"

[build]

[deploy]
  # The new release boots beside the running one and takes the traffic once
  # its check passes.
  strategy = "bluegreen"

[http_service]
  internal_port = 3000
  force_https = false
  # Always on: the tunnel comes over .internal, which never wakes a stopped
  # Machine.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/llms.txt"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
